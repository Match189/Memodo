services:
  db:
    image: postgres:16
    environment:
      # 从 .env 读取（cp .env.example .env 后修改）；留默认值仅适合本机试用
      # Read from .env (cp .env.example .env and edit); defaults are local-trial only
      POSTGRES_USER: memodo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: memodo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memodo"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://memodo:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/memodo
      # JWT 签名密钥：必须修改！生成: openssl rand -hex 32
      # JWT signing secret: MUST be changed. Generate with: openssl rand -hex 32
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (openssl rand -hex 32)}
    ports:
      - "8000:8000"

volumes:
  pgdata:
