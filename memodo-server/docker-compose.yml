services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: memodo
      POSTGRES_PASSWORD: memodo
      POSTGRES_DB: memodo
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memodo"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://memodo:memodo@db:5432/memodo
      JWT_SECRET: please-change-this-in-prod
      CORS_ORIGINS: "http://localhost:5173,http://localhost:8080"
    ports:
      - "8000:8000"

volumes:
  pgdata:
