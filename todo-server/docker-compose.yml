# TodoList 自建同步服务器（SPD §16：docker compose up -d 一键部署）
#
# 密钥与数据库口令从 .env 读取（参考 .env.example），严禁提交真实值。
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: todolist
      POSTGRES_USER: todolist
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    restart: unless-stopped

  app:
    build: .
    environment:
      TODOLIST_SECRET_KEY: ${SECRET_KEY:?set in .env}
      TODOLIST_DATABASE_URL: postgresql+asyncpg://todolist:${POSTGRES_PASSWORD}@db:5432/todolist
    depends_on:
      - db
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

  # 可选：自动 HTTPS 反向代理。启用前把域名写进 Caddyfile。
  # caddy:
  #   image: caddy:2-alpine
  #   ports: ["80:80", "443:443"]
  #   volumes:
  #     - ./Caddyfile:/etc/caddy/Caddyfile
  #     - caddy-data:/data
  #   restart: unless-stopped

volumes:
  db-data:
